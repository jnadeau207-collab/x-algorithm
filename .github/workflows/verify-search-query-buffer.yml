name: Verify search-query buffer fix

on:
  push:
    branches:
      - ci/verify-search-query-buffer

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-search-query-buffer
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates cmake curl pkg-config unzip \
            libibverbs-dev libnl-3-dev libnl-route-3-dev libclang-dev libnuma-dev \
            libssl-dev python3-dev protobuf-compiler

      - name: Apply minimal production fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("phoenix/crates/common/xai-recsys/src/util.rs")
          text = path.read_text()

          start_marker = (
              "        let mut candidate_search_query_embeddings = "
              "vec![0.0f32; search_query_embedding_dim];\n"
          )
          end_marker = "\n\n        let n_post_cat ="
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''        let candidate_search_query_embeddings = if search_query_embedding_dim > 0
              && candidate_set.search_query_embedding.len() == search_query_embedding_dim
          {
              candidate_set.search_query_embedding.clone()
          } else {
              if search_query_embedding_dim > 0 && !candidate_set.search_query_embedding.is_empty() {
                  log::error!(
                      "search_query_embedding dim {} != model {search_query_embedding_dim}; using zero vector",
                      candidate_set.search_query_embedding.len()
                  );
              }
              vec![0.0f32; search_query_embedding_dim]
          };'''

          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --manifest-path phoenix/Cargo.toml --all
          git diff --check
          git restore phoenix/Cargo.lock || true
          test "$(git diff --name-only)" = \
            "phoenix/crates/common/xai-recsys/src/util.rs"

      - name: Prove regression on upstream main
        run: |
          git worktree add /tmp/upstream-main 7ba776848b12d8422eb0f291ee03ea5c17ab0188
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/upstream-main/phoenix/crates/common/xai-recsys/src/util.rs")
          text = path.read_text()
          marker = (
              "    #[test]\n"
              "    fn repeat_query_into_writes_prefix_and_keeps_tail() {\n"
          )
          regression = (
              "    #[test]\n"
              "    fn missing_search_query_overwrites_reused_candidate_prefix_with_zeros() {\n"
              "        let mut model_config = test_model_config(1);\n"
              "        model_config.search_query_embedding_dim = 2;\n"
              "        let candidates = vec![\n"
              "            pb::TweetInfo {\n"
              "                tweet_id: 1000,\n"
              "                author_id: 2000,\n"
              "                ..Default::default()\n"
              "            },\n"
              "            pb::TweetInfo {\n"
              "                tweet_id: 1001,\n"
              "                author_id: 2001,\n"
              "                ..Default::default()\n"
              "            },\n"
              "        ];\n"
              "\n"
              "        let with_query = InputBuffer::new_with_candidates(\n"
              "            &model_config,\n"
              "            &pb::CandidateSet {\n"
              "                search_query_embedding: vec![1.0, 2.0],\n"
              "                candidates: candidates.clone(),\n"
              "                ..Default::default()\n"
              "            },\n"
              "            None,\n"
              "        );\n"
              "        let without_query = InputBuffer::new_with_candidates(\n"
              "            &model_config,\n"
              "            &pb::CandidateSet {\n"
              "                candidates,\n"
              "                ..Default::default()\n"
              "            },\n"
              "            None,\n"
              "        );\n"
              "\n"
              "        let mut reused_row = vec![9.0f32; 6];\n"
              "        repeat_query_into(&mut reused_row, &with_query.search_query_embeddings, 2);\n"
              "        repeat_query_into(&mut reused_row, &without_query.search_query_embeddings, 2);\n"
              "\n"
              "        assert_eq!(reused_row, vec![0.0, 0.0, 0.0, 0.0, 9.0, 9.0]);\n"
              "    }\n"
              "\n"
          )
          if marker not in text:
              raise SystemExit("baseline test insertion marker not found")
          path.write_text(text.replace(marker, regression + marker, 1))
          PY
          cargo fmt --manifest-path /tmp/upstream-main/phoenix/Cargo.toml --all
          set +e
          cargo test \
            --manifest-path /tmp/upstream-main/phoenix/Cargo.toml \
            -p xai-recsys \
            missing_search_query_overwrites_reused_candidate_prefix_with_zeros \
            > /tmp/baseline-test.log 2>&1
          status=$?
          set -e
          cat /tmp/baseline-test.log
          test "$status" -ne 0
          grep -q "left: \[1.0, 2.0, 1.0, 2.0, 9.0, 9.0\]" \
            /tmp/baseline-test.log
          grep -q "right: \[0.0, 0.0, 0.0, 0.0, 9.0, 9.0\]" \
            /tmp/baseline-test.log

      - name: Verify final implementation
        working-directory: phoenix
        run: |
          cargo fmt --all -- --check
          cargo test -p xai-recsys search_query
          cargo test -p xai-recsys
          cargo test -p xai-recsys-engine --lib

      - name: Commit verified implementation
        run: |
          git restore phoenix/Cargo.lock || true
          git diff --check
          test "$(git diff --name-only)" = \
            "phoenix/crates/common/xai-recsys/src/util.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phoenix/crates/common/xai-recsys/src/util.rs
          git commit -m "phoenix: prevent stale search query embeddings"
          git push origin HEAD:ci/verify-search-query-buffer
