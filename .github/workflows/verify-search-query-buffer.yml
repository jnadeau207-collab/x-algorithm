name: Verify search-query buffer fix

on:
  push:
    branches:
      - ci/verify-search-query-buffer

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-search-query-buffer

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Apply focused fix and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("phoenix/crates/common/xai-recsys/src/util.rs")
          text = path.read_text()

          start_marker = (
              "        let candidate_search_query_embeddings = if "
              "search_query_embedding_dim > 0\n"
          )
          end_marker = "\n\n        let n_post_cat ="
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = (
              "        let mut candidate_search_query_embeddings = "
              "vec![0.0f32; search_query_embedding_dim];\n"
              "        if search_query_embedding_dim > 0 "
              "&& !candidate_set.search_query_embedding.is_empty() {\n"
              "            if candidate_set.search_query_embedding.len() "
              "== search_query_embedding_dim {\n"
              "                candidate_search_query_embeddings\n"
              "                    .copy_from_slice(&candidate_set.search_query_embedding);\n"
              "            } else {\n"
              "                log::error!(\n"
              "                    \"search_query_embedding dim {} != model "
              "{search_query_embedding_dim}; leaving zeros\",\n"
              "                    candidate_set.search_query_embedding.len()\n"
              "                );\n"
              "            }\n"
              "        }"
          )
          text = text[:start] + replacement + text[end:]

          test_marker = (
              "    #[test]\n"
              "    fn repeat_query_into_writes_prefix_and_keeps_tail() {\n"
          )
          tests = (
              "    #[test]\n"
              "    fn missing_search_query_overwrites_reused_candidate_prefix_with_zeros() {\n"
              "        let mut model_config = test_model_config(1);\n"
              "        model_config.search_query_embedding_dim = 2;\n"
              "        let candidates = vec![\n"
              "            pb::TweetInfo {\n"
              "                tweet_id: 1000,\n"
              "                author_id: 2000,\n"
              "                ..Default::default()\n"
              "            },\n"
              "            pb::TweetInfo {\n"
              "                tweet_id: 1001,\n"
              "                author_id: 2001,\n"
              "                ..Default::default()\n"
              "            },\n"
              "        ];\n"
              "\n"
              "        let with_query = InputBuffer::new_with_candidates(\n"
              "            &model_config,\n"
              "            &pb::CandidateSet {\n"
              "                search_query_embedding: vec![1.0, 2.0],\n"
              "                candidates: candidates.clone(),\n"
              "                ..Default::default()\n"
              "            },\n"
              "            None,\n"
              "        );\n"
              "        let without_query = InputBuffer::new_with_candidates(\n"
              "            &model_config,\n"
              "            &pb::CandidateSet {\n"
              "                candidates,\n"
              "                ..Default::default()\n"
              "            },\n"
              "            None,\n"
              "        );\n"
              "\n"
              "        let mut reused_row = vec![9.0f32; 6];\n"
              "        repeat_query_into(&mut reused_row, &with_query.search_query_embeddings, 2);\n"
              "        assert_eq!(reused_row, vec![1.0, 2.0, 1.0, 2.0, 9.0, 9.0]);\n"
              "\n"
              "        repeat_query_into(&mut reused_row, &without_query.search_query_embeddings, 2);\n"
              "        assert_eq!(reused_row, vec![0.0, 0.0, 0.0, 0.0, 9.0, 9.0]);\n"
              "    }\n"
              "\n"
              "    #[test]\n"
              "    fn malformed_search_query_uses_one_zero_vector() {\n"
              "        let mut model_config = test_model_config(1);\n"
              "        model_config.search_query_embedding_dim = 4;\n"
              "        let candidate_set = pb::CandidateSet {\n"
              "            search_query_embedding: vec![1.0, 2.0],\n"
              "            ..Default::default()\n"
              "        };\n"
              "\n"
              "        let cand = InputBuffer::new_with_candidates(&model_config, &candidate_set, None);\n"
              "\n"
              "        assert_eq!(cand.search_query_embeddings, vec![0.0; 4]);\n"
              "    }\n"
              "\n"
          )
          if test_marker not in text:
              raise SystemExit("test insertion marker not found")
          text = text.replace(test_marker, tests + test_marker, 1)
          path.write_text(text)
          PY

      - name: Format and validate focused diff
        run: |
          cargo fmt --manifest-path phoenix/Cargo.toml --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "phoenix/crates/common/xai-recsys/src/util.rs"

      - name: Run focused regression tests
        working-directory: phoenix
        run: cargo test -p xai-recsys search_query

      - name: Run xai-recsys test suite
        working-directory: phoenix
        run: cargo test -p xai-recsys

      - name: Commit verified patch
        run: |
          git restore phoenix/Cargo.lock || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phoenix/crates/common/xai-recsys/src/util.rs
          git commit -m "phoenix: zero missing search query embeddings"
          git push origin HEAD:ci/verify-search-query-buffer
