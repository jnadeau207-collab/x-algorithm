name: Verify Under the Hood post IDs v3

on:
  push:
    branches:
      - ci/verify-uth-post-ids

permissions:
  contents: write

jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'ci: verify Under the Hood post IDs v3' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-uth-post-ids
          fetch-depth: 0

      - name: Apply production patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          workflow_path = Path(".github/workflows/verify-uth-post-ids.yml")
          workflow = workflow_path.read_text()
          heredoc_start = "          python3 - <<'PY'\n"
          start = workflow.index(heredoc_start) + len(heredoc_start)
          end = workflow.index("\n          PY", start)
          original_script = dedent(workflow[start:end])

          publisher_marker = (
              '\npublisher = "under-the-hood/scalding/'
              'UthUserMonthMhPublisherJob.scala"\n'
          )
          report_marker = (
              '\nreport = "under-the-hood/strato/columns/'
              'underTheHoodReport.User.strato"\n'
          )
          if original_script.count(publisher_marker) != 1:
              raise SystemExit("publisher section marker is not unique")
          prefix, publisher_and_report = original_script.split(publisher_marker, 1)
          if publisher_and_report.count(report_marker) != 1:
              raise SystemExit("report section marker is not unique")
          _, report_tail = publisher_and_report.split(report_marker, 1)

          namespace = {}
          exec(prefix, namespace, namespace)

          publisher_path = Path(
              "under-the-hood/scalding/UthUserMonthMhPublisherJob.scala"
          )
          lines = publisher_path.read_text().splitlines(keepends=True)

          removed_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == "removed <- row.removed"
          ]
          if len(removed_matches) != 1:
              raise SystemExit(
                  f"expected one publisher removed binding, found {len(removed_matches)}"
              )
          removed_idx = removed_matches[0]
          if lines[removed_idx + 1].strip() != (
              "} yield ((userId, monthBucket(day)), "
              "(label, dayOfMonth(day), carried, removed))"
          ):
              raise SystemExit(
                  "publisher yield after removed binding changed: "
                  + repr(lines[removed_idx + 1])
              )
          binding_indent = lines[removed_idx][
              : len(lines[removed_idx]) - len(lines[removed_idx].lstrip())
          ]
          yield_indent = lines[removed_idx + 1][
              : len(lines[removed_idx + 1]) - len(lines[removed_idx + 1].lstrip())
          ]
          lines[removed_idx : removed_idx + 2] = [
              f"{binding_indent}removed <- row.removed\n",
              f"{binding_indent}postIds = row.postIds.getOrElse(Seq.empty)\n",
              f"{yield_indent}}} yield (\n",
              f"{yield_indent}  (userId, monthBucket(day)),\n",
              (
                  f"{yield_indent}  (label, dayOfMonth(day), carried, removed, "
                  "postIds)\n"
              ),
              f"{yield_indent})\n",
          ]

          group_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == ".groupBy { case (label, _, _, _) => label }"
          ]
          if len(group_matches) != 1:
              raise SystemExit(
                  f"expected one post-label groupBy, found {len(group_matches)}"
              )
          group_idx = group_matches[0]
          group_indent = lines[group_idx][
              : len(lines[group_idx]) - len(lines[group_idx].lstrip())
          ]
          lines[group_idx] = (
              f"{group_indent}.groupBy {{ case (label, _, _, _, _) => label }}\n"
          )

          aggregate_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == "val postLabelAgg = labelsOpt"
          ]
          if len(aggregate_matches) != 1:
              raise SystemExit(
                  f"expected one postLabelAgg anchor, found {len(aggregate_matches)}"
              )
          aggregate_idx = aggregate_matches[0]
          start_matches = [
              i for i in range(aggregate_idx, len(lines))
              if lines[i].strip() == "val days = rows"
          ]
          if not start_matches:
              raise SystemExit("postLabelAgg days block not found")
          block_start = start_matches[0]
          end_matches = [
              i for i in range(block_start, len(lines))
              if lines[i].strip() == "UthPostLabelAggregate(Some(label), Some(days))"
          ]
          if not end_matches:
              raise SystemExit("postLabelAgg constructor not found")
          block_end = end_matches[0]
          block_indent = lines[block_start][
              : len(lines[block_start]) - len(lines[block_start].lstrip())
          ]
          replacement = indent(
              dedent(
                  """\
                  val selectedRows = rows
                    .groupBy { case (_, day, _, _, _) => day }
                    .values
                    .map { dayRows =>
                      dayRows.maxBy {
                        case (_, _, carried, removed, postIds) =>
                          (carried, removed, postIds.size)
                      }
                    }
                    .toList
                  val days = selectedRows
                    .map {
                      case (_, day, carried, removed, _) =>
                        UthDayCarriedRemoved(Some(day), Some(carried), Some(removed))
                    }
                    .sortBy(_.dayOfMonth.getOrElse(0))
                  val postIds = UthPostIds.newestDistinct(
                    selectedRows.flatMap(_._5),
                    UthPostIds.MaxPostIdsPerLabel
                  )
                  UthPostLabelAggregate(
                    label = Some(label),
                    days = Some(days),
                    postIds = Some(postIds)
                  )
                  """
              ),
              block_indent,
          )
          lines[block_start : block_end + 1] = [replacement]
          publisher_path.write_text("".join(lines))

          report_code = (
              'report = "under-the-hood/strato/columns/'
              'underTheHoodReport.User.strato"\n' + report_tail
          )
          exec(report_code, namespace, namespace)
          PY

      - name: Run verification suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path(".github/workflows/verify-uth-post-ids-v2.yml").read_text().splitlines()
          wanted = [
              "Install verification tools",
              "Verify Thrift and Scala syntax",
              "Run exact post-ID helper tests",
              "Verify report and pipeline contract",
              "Verify focused final diff",
              "Commit verified implementation",
          ]
          scripts = {}
          i = 0
          while i < len(source):
              line = source[i]
              if line.startswith("      - name: "):
                  name = line[len("      - name: ") :]
                  j = i + 1
                  while j < len(source) and not source[j].startswith("      - "):
                      if source[j] == "        run: |":
                          j += 1
                          block = []
                          while j < len(source) and not source[j].startswith("      - "):
                              current = source[j]
                              block.append(current[10:] if current.startswith("          ") else current)
                              j += 1
                          scripts[name] = "\n".join(block) + "\n"
                          break
                      j += 1
              i += 1

          missing = [name for name in wanted if name not in scripts]
          if missing:
              raise SystemExit(f"verification scripts missing: {missing}")

          for name in wanted:
              print(f"::group::{name}", flush=True)
              subprocess.run(
                  ["bash", "-c", "set -euo pipefail\n" + scripts[name]],
                  check=True,
              )
              print("::endgroup::", flush=True)
          PY
