name: Export source for audit

on:
  push:
    branches:
      - ci/export-x-source

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/export-x-source
      - name: Package complete source
        run: |
          tar --exclude=.git -czf /tmp/x-algorithm-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: x-algorithm-complete-source
          path: /tmp/x-algorithm-source.tar.gz
          if-no-files-found: error
          retention-days: 1
